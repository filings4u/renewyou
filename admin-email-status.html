<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Email Status | ReNew You Health & Wellness</title>
<meta name="robots" content="noindex,nofollow,noarchive">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="assets/css/style.css">
<link rel="icon" type="image/png" href="images/fav.png">
<style>
:root{--p:#3e0d5f;--a:#8a349b;--bg:#f7f4f8;--line:#e6dfe9;--muted:#746a79}*{box-sizing:border-box}body{display:block!important;justify-content:initial!important;align-items:stretch!important;min-height:100vh!important}header{position:static!important;top:auto!important;z-index:auto!important}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#2b2030}.wrap{width:min(1450px,calc(100% - 40px));margin:0 auto;padding:28px 0 50px}.top{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:22px}.top h1{margin:4px 0 6px;color:var(--p);font-size:30px}.top p{margin:0;color:var(--muted)}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.btn.primary{background:var(--p);color:#fff}.btn.secondary{background:#fff;color:var(--p);border:1px solid var(--line)}.btn:disabled{opacity:.55;cursor:not-allowed}.metrics{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-bottom:18px}.metric{background:#fff;border:1px solid var(--line);border-radius:15px;padding:18px}.metric span{display:block;font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}.metric strong{display:block;margin-top:7px;font-size:27px;color:var(--p)}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 8px 26px rgba(62,13,95,.05)}.filters{display:grid;grid-template-columns:1.3fr .8fr .8fr auto;gap:10px;margin-bottom:14px}.filters input,.filters select{width:100%;border:1px solid #ddd6e2;border-radius:10px;padding:11px 12px;font:inherit}.notice{padding:11px 13px;border-radius:10px;background:#faf7fb;color:#5f5265;font-size:13px;margin-bottom:14px;display:none}.tablewrap{overflow:auto;border:1px solid #eee8f1;border-radius:12px}table{width:100%;border-collapse:collapse;table-layout:fixed}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid #f0ebf2;font-size:12.5px;line-height:1.25;vertical-align:middle}th{background:#faf8fb;color:#5a4d60;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;position:sticky;top:0}th:nth-child(1),td:nth-child(1){width:19%}th:nth-child(2),td:nth-child(2){width:18%}th:nth-child(3),td:nth-child(3){width:9%}th:nth-child(4),td:nth-child(4){width:10%}th:nth-child(5),td:nth-child(5){width:10%}th:nth-child(6),td:nth-child(6){width:8%}th:nth-child(7),td:nth-child(7){width:8%}th:nth-child(8),td:nth-child(8){width:18%}td:nth-child(1),td:nth-child(2),td:nth-child(8){overflow-wrap:anywhere}td small{display:block;color:#8b808f;margin-top:2px}.badge{display:inline-flex;padding:4px 7px;border-radius:999px;background:#f1edf3;color:#5e5264;font-size:10px;font-weight:900;white-space:nowrap}.badge.opened{background:#e8f7ef;color:#16734a}.badge.bounced,.badge.failed,.badge.complained{background:#fdecec;color:#a12d2d}.badge.delivered{background:#edf3ff;color:#315d9d}.pager{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px}.empty{text-align:center;padding:26px;color:#837786}@media(max-width:1100px){table{min-width:1050px;table-layout:auto}}@media(max-width:900px){.metrics{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr}.wrap{width:min(100% - 24px,1450px)}.top{flex-direction:column}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div><div style="font-size:11px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:#8a349b">Communications</div><h1>Email Status</h1><p>Track every campaign email sent through Resend, including opens and bounces.</p></div><div class="actions"><a class="btn secondary" href="admin-dashboard.html">← Admin Dashboard</a><button id="syncBtn" class="btn primary">Sync Resend Status</button></div></div>
  
  <div class="metrics"><div class="metric"><span>Sent</span><strong id="mSent">0</strong></div><div class="metric"><span>Delivered</span><strong id="mDelivered">0</strong></div><div class="metric"><span>Opened</span><strong id="mOpened">0</strong></div><div class="metric"><span>Bounced</span><strong id="mBounced">0</strong></div><div class="metric"><span>Failed</span><strong id="mFailed">0</strong></div></div>
  <div class="card"><div class="filters"><input id="search" type="search" placeholder="Search email or campaign"><select id="campaignFilter"><option value="">All campaigns</option></select><select id="statusFilter"><option value="">All statuses</option><option value="sent">Sent</option><option value="delivered">Delivered</option><option value="opened">Opened</option><option value="bounced">Bounced</option><option value="failed">Failed</option><option value="complained">Complained</option></select><button id="refreshBtn" class="btn secondary">Refresh</button></div><div class="tablewrap"><table><thead><tr><th>Email</th><th>Campaign</th><th>Status</th><th>Sent</th><th>Delivered</th><th>Opened</th><th>Bounced</th><th>Provider</th></tr></thead><tbody id="rows"><tr><td colspan="8" class="empty">Loading email activity...</td></tr></tbody></table></div><div class="pager"><span id="rowCount">0 records</span><div class="actions"><button id="prevBtn" class="btn secondary">Previous</button><button id="nextBtn" class="btn secondary">Next</button></div></div></div>
</div>
<script src="assets/js/admin-popups.js"></script><script src="assets/js/admin-email-status.js"></script>
</body></html>
