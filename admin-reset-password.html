<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Staff Password | ReNew You Health & Wellness</title>
  <meta name="robots" content="noindex,nofollow,noarchive">
  <link rel="icon" type="image/png" href="images/fav.png">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--purple:#3e0d5f;--accent:#8a349b;--ink:#342338;--soft:#f7f4f8}
    *{box-sizing:border-box} body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#faf7fb,#f2ebf5);color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:24px}
    .card{width:min(100%,460px);background:#fff;border-radius:20px;padding:32px;box-shadow:0 20px 60px rgba(62,13,95,.14);border:1px solid rgba(62,13,95,.08)}
    .logo{display:block;width:190px;max-width:70%;height:auto;margin:0 auto 24px}.eyebrow{text-align:center;color:var(--accent);font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
    h1{text-align:center;color:var(--purple);font-size:26px;margin:8px 0 10px}.lead{text-align:center;color:#666;font-size:14px;line-height:1.6;margin:0 0 24px}
    label{display:block;font-size:12px;font-weight:800;text-transform:uppercase;margin:14px 0 7px}.field{width:100%;padding:13px 15px;border:1px solid #ddd;border-radius:10px;font-size:16px}
    .btn{width:100%;border:0;border-radius:10px;background:var(--purple);color:#fff;padding:14px;font-weight:800;font-size:15px;cursor:pointer;margin-top:18px}.btn:disabled{opacity:.65;cursor:wait}
    .msg{display:none;margin-top:16px;padding:12px;border-radius:9px;font-size:14px;line-height:1.5}.error{background:#fff2f2;color:#a11}.success{background:#effaf3;color:#216e39}.back{display:block;text-align:center;margin-top:18px;color:var(--accent);font-weight:700;text-decoration:none}
  </style>
</head>
<body>
  <main class="card">
    <img src="images/logo2.png" class="logo" alt="ReNew You Health & Wellness">
    <div class="eyebrow">Secure staff access</div>
    <h1>Create a new password</h1>
    <p class="lead">Enter a new password for your ReNew You staff account.</p>
    <form id="resetForm">
      <label for="password">New password</label>
      <input class="field" id="password" type="password" minlength="8" autocomplete="new-password" required>
      <label for="confirmPassword">Confirm password</label>
      <input class="field" id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required>
      <button class="btn" id="submitBtn" type="submit">Update Password</button>
      <div id="message" class="msg"></div>
    </form>
    <a href="admin-dashboard.html" class="back">Back to staff sign-in</a>
  </main>
<script>
const SUPABASE_URL='https://eybsgwzpisgswmxcwjel.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_R_kVcbPeNKKDIVQM8l2gZQ_6fUa4weF';
const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const form=document.getElementById('resetForm');
const message=document.getElementById('message');
const submitBtn=document.getElementById('submitBtn');
function show(text,type){message.textContent=text;message.className='msg '+type;message.style.display='block'}
form.addEventListener('submit',async(e)=>{
  e.preventDefault(); message.style.display='none';
  const password=document.getElementById('password').value;
  const confirm=document.getElementById('confirmPassword').value;
  if(password!==confirm){show('The passwords do not match.','error');return}
  if(password.length<8){show('Use at least 8 characters.','error');return}
  submitBtn.disabled=true;
  const {error}=await client.auth.updateUser({password});
  if(error){show(error.message,'error');submitBtn.disabled=false;return}
  show('Password updated. Redirecting to staff sign-in…','success');
  await client.auth.signOut();
  setTimeout(()=>window.location.href='admin-dashboard.html',1200);
});
</script>
</body>
</html>
