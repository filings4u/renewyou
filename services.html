<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <meta name="theme-color" content="#3E0D5F"> 
    <title>Our Services | ReNew You Health & Wellness</title> 
    <!-- Include Supabase Client Dependency --> 
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script> 
    <!-- External Theme Tokens and Base Layout Stylesheet --> 
    <link rel="stylesheet" href="assets/css/style.css"> 
    <link rel="icon" type="image/png" href="images/fav.png"> 
</head> 
<body> 
    <!-- Dynamic Header Component Slot Target --> 
    <div id="navigation-target"></div> 
    
    <!-- NEW Dynamic Side-by-Side Hero Component Target --> 
    <div id="services-hero-target"></div> 
    
    <main style="background-color: #F9F9F8;"> 
        <!-- Services Section Header Introduction --> 
        <section class="services-intro-section" style="text-align: center; padding: 80px 20px 40px 20px; box-sizing: border-box;"> 
            <style>
                /* Embedded Mobile Safeguards for Main Container Structure */
                @media (max-width: 768px) {
                    .services-intro-section {
                        padding: 40px 20px 20px 20px !important;
                    }
                    .services-intro-section h1 {
                        font-size: 1.85rem !important;
                    }
                    .services-intro-section p {
                        font-size: 1rem !important;
                    }
                    .services-grid-wrapper {
                        padding: 10px 15px 50px 15px !important;
                    }
                }
            </style>
           <!-- NEW Dynamic Side-by-Side Hero Component Target --> 
<div id="services-hero-target"></div>
        </section> 

        <!-- Dynamic Medical Services Catalog Target Grid --> 
        <section class="services-grid-wrapper" style="padding: 20px 20px 80px 20px; box-sizing: border-box;"> 
            <div id="services-grid-target"></div> 
        </section> 

      <!-- NEW: Email News List Capture Module Target -->
<div id="subscribe-target"></div>
    </main> 

    <!-- Dynamic Footer Component Slot Target --> 
    <div id="footer-target"></div> 

    <!-- Layout Scripts Execution Flow --> 
    <script src="assets/js/navigation.js"></script> 
    <script src="assets/js/services-hero.js"></script> 
    <script src="assets/js/services-1.js"></script> 
    <script src="assets/js/subscribe.js"></script> 
    <script src="assets/js/footer.js"></script> 
    <!-- Page Functional Event Logic Engine --> 
    <script src="assets/js/new-services.js"></script> 
</body> 
</html>
