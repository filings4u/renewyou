<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" type="image/png" href="images/fav.png">
<title>Campaign Preview | ReNew You</title>
<meta name="robots" content="noindex,nofollow">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="assets/css/style.css">
<style>
:root{--p:#3e0d5f;--a:#8a349b;--bg:#f6f4f8;--line:#e5dfe8;--muted:#746a79;--text:#2c2230}
*{box-sizing:border-box}body{display:block!important;justify-content:initial!important;align-items:stretch!important;min-height:100vh!important}header{position:static!important;top:auto!important;z-index:auto!important}
html,body{margin:0;min-height:100%;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--text)}
.preview-page{width:min(1450px,calc(100% - 40px));margin:0 auto;padding:24px 0 40px}
.preview-head{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:16px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.preview-title .kicker{font-size:11px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--a)}
.preview-title h1{margin:4px 0 0;color:var(--p);font-size:24px;line-height:1.2}
.preview-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.preview-actions a,.preview-actions button{height:38px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--p);padding:0 14px;font:800 13px/1 inherit;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:none}
.preview-actions button.active{background:var(--p);color:#fff;border-color:var(--p)}
.preview-stage{width:100%;min-height:calc(100vh - 130px);display:flex;align-items:flex-start;justify-content:center;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:auto;padding:0}
#previewFrame{display:block;width:100%;min-height:calc(100vh - 132px);border:0;background:#fff;box-shadow:none;border-radius:0}
.preview-stage.mobile{background:#eeeaf0;padding:20px 0}
.preview-stage.mobile #previewFrame{width:390px;max-width:390px;min-height:780px}
.notice{padding:16px;color:#8c2f3f;font-weight:700}
@media(max-width:700px){.preview-page{width:min(100% - 20px,1450px);padding-top:10px}.preview-head{align-items:flex-start;flex-direction:column}.preview-actions{width:100%}.preview-actions a,.preview-actions button{flex:1}.preview-stage.mobile{padding:10px 0}.preview-stage.mobile #previewFrame{width:100%;max-width:390px}}
</style>
<link rel="stylesheet" href="assets/css/admin-shared-nav.css">
</head>
<body>
<div class="preview-page">
  <header class="preview-head">
    <div class="preview-title">
      <div class="kicker">Email Preview</div>
      <h1 id="previewTitle">Campaign Preview</h1>
    </div>
    <div class="preview-actions">
      <a id="backToEditor" href="admin-campaign-editor.html">← Back to Editor</a>
      <button id="desktopBtn" class="active" type="button">Desktop</button>
      <button id="mobileBtn" type="button">Mobile</button>
    </div>
  </header>
  <main id="previewStage" class="preview-stage desktop">
    <iframe id="previewFrame" title="Campaign email preview"></iframe>
  </main>
</div>
<script src="assets/js/admin-popups.js"></script><script src="assets/js/admin-campaign-preview.js"></script>
<script src="assets/js/admin-shared-nav.js"></script>
</body>
</html>
