<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Preferences | ReNew You Health & Wellness</title>
  <meta name="robots" content="noindex,nofollow,noarchive">
  <link rel="icon" type="image/png" href="images/fav.png">
  <style>
    :root{--purple:#3e0d5f;--accent:#8a349b;--ink:#342338;--muted:#706777;--bg:#f7f4f8;--danger:#a51f32}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:24px}
    .card{width:min(580px,100%);background:#fff;border:1px solid #eadff0;border-radius:22px;overflow:hidden;box-shadow:0 24px 70px rgba(62,13,95,.12)}
    .head{background:var(--purple);padding:28px;text-align:center}.head img{width:190px;max-width:75%;background:#fff;border-radius:12px;padding:8px 15px}
    .body{padding:36px}.eyebrow{font-size:12px;font-weight:900;letter-spacing:.16em;color:var(--accent);text-transform:uppercase}.body h1{margin:10px 0 12px;font-size:28px}.body p{color:var(--muted);line-height:1.65;margin:0 0 18px}
    .status{display:none;padding:14px 16px;border-radius:12px;background:#faf7fb;color:#5d4e63;line-height:1.55;margin-bottom:18px}.status.show{display:block}.status.success{background:#eef8e8;color:#397409}.status.error{background:#fff0f2;color:#a4001c}
    .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.btn{appearance:none;border:0;border-radius:11px;padding:12px 18px;font-size:15px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.btn-danger{background:var(--danger);color:#fff}.btn-secondary{background:#f3edf5;color:var(--purple)}.btn:disabled{opacity:.55;cursor:not-allowed}
    a{color:var(--accent);font-weight:700}.footer{padding:18px 28px;background:#fbf9fc;color:#887c8d;text-align:center;font-size:12px;line-height:1.6}
  </style>
  <meta property="og:locale" content="en_US"><meta property="og:type" content="website"><meta property="og:site_name" content="ReNew You Health & Wellness"><meta property="og:title" content="Email Preferences | ReNew You Health & Wellness"><meta property="og:url" content="https://renewyouhealthwellness.com/unsubscribe.html"><meta property="og:image" content="https://renewyouhealthwellness.com/images/social/unsubscribe.jpg"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:image" content="https://renewyouhealthwellness.com/images/social/unsubscribe.jpg">
</head>
<body>
  <main class="card">
    <div class="head"><img src="images/logo2.png" alt="ReNew You Health & Wellness"></div>
    <div class="body">
      <div class="eyebrow">Email Preferences</div>
      <h1>Unsubscribe</h1>
      <p>Confirm below to stop receiving ReNew You Health & Wellness marketing and wellness emails. Transactional or care-related messages are not affected.</p>
      <div id="unsubscribeStatus" class="status" role="status" aria-live="polite"></div>
      <div class="actions" id="unsubscribeActions">
        <button type="button" id="unsubscribeBtn" class="btn btn-danger">Unsubscribe Me</button>
        <a href="index.html" class="btn btn-secondary">Keep Me Subscribed</a>
      </div>
    </div>
    <div class="footer">500 Ashland Ave., Suite 101 · Chicago Heights, IL 60411 · (708) 329-2155</div>
  </main>
  <script>
    (()=>{
      const button=document.getElementById('unsubscribeBtn');
      const status=document.getElementById('unsubscribeStatus');
      const actions=document.getElementById('unsubscribeActions');
      const token=new URLSearchParams(location.search).get('token')||'';
      const show=(message,type)=>{status.className=`status show ${type||''}`;status.textContent=message;};
      if(!token){show('This unsubscribe link is invalid or incomplete.','error');button.disabled=true;return;}
      button.addEventListener('click',async()=>{
        button.disabled=true;button.textContent='Unsubscribing…';show('Updating your email preferences…','');
        try{
          const response=await fetch('https://eybsgwzpisgswmxcwjel.supabase.co/functions/v1/unsubscribe-email',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})});
          const result=await response.json().catch(()=>({}));
          if(!response.ok) throw new Error(result.error||'Unable to update your email preferences.');
          show(result.already_unsubscribed?'You were already unsubscribed from marketing emails.':'You have been unsubscribed from ReNew You Health & Wellness marketing emails.','success');
          actions.innerHTML='<a href="index.html" class="btn btn-secondary">Return to ReNew You</a>';
        }catch(error){show(error?.message||'Unable to update your email preferences. Please contact us for assistance.','error');button.disabled=false;button.textContent='Try Again';}
      });
    })();
  </script>
</body>
</html>
