<body class="admin-page">
  <main class="card">
    <img src="images/logo2.png" class="logo" alt="ReNew You Health & Wellness">
    <div class="eyebrow">Secure staff access</div>
    <h1>Create a new password</h1>
    <p class="lead">Enter a new password for your ReNew You staff account.</p>
    <form id="resetForm">
      <label for="password">New password</label>
      <div class="admin-password-wrap"><input class="field" id="password" type="password" minlength="8" autocomplete="new-password" required><button type="button" class="admin-password-toggle" data-password-toggle="password" aria-label="Show password" aria-pressed="false"><span aria-hidden="true">👁</span></button></div>
      <label for="confirmPassword">Confirm password</label>
      <div class="admin-password-wrap"><input class="field" id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required><button type="button" class="admin-password-toggle" data-password-toggle="confirmPassword" aria-label="Show password" aria-pressed="false"><span aria-hidden="true">👁</span></button></div>
      <button class="btn" id="submitBtn" type="submit">Update Password</button>
      <div id="message" class="msg"></div>
    </form>
    <a href="index.html" class="back">Back to staff sign-in</a>
  </main>


<script src="js/reset-password-page.js"></script>
