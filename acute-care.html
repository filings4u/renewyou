<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#3E0D5F">
  <title>Same-Day Diagnostic Evaluations & Care | ReNew You Health & Wellness</title>
  <!-- Include Supabase Client Dependency -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- External Theme Tokens and Base Layout Stylesheet -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" type="image/png" href="images/fav.png">
</head>
<body>

  <!-- Dynamic Header Component Slot Target -->
  <div id="navigation-target"></div>

  <!-- Dynamic Centralized Dynamic Static Hero Component Target -->
  <div id="hero-target"></div>

  <main style="background-color: #F9F9F8;">
    <!-- Services Section Header Introduction -->
    <section class="services-intro-section" style="text-align: center; padding: 80px 20px 40px 20px; box-sizing: border-box;">
      <style>
        /* Embedded Mobile Safeguards for Main Container Structure */
        @media (max-width: 768px) {
          .services-intro-section {
            padding: 40px 20px 20px 20px !important;
          }
          .services-intro-section h1 {
            font-size: 1.85rem !important;
          }
          .services-intro-section p {
            font-size: 1rem !important;
          }
        }
      </style>
      
      <!-- Injection point for dynamic Acute Care brochure details -->
      <div id="acute-care-content-target"></div>

      <!-- Dynamic Email News List Capture Module Target -->
      <div id="subscribe-target"></div>
    </section>
  </main>

  <!-- Dynamic Footer Component Slot Target -->
  <div id="footer-target"></div>

  <!-- Layout Scripts Execution Flow -->
  <script src="assets/js/navigation.js"></script>
  <script src="assets/js/hero.js"></script>
  <script src="assets/js/acute-care-section.js"></script>
  <script src="assets/js/acute-care.js"></script>
  <script src="assets/js/subscribe.js"></script>
  <script src="assets/js/footer.js"></script>
</body>
</html>
