<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <meta name="theme-color" content="#3E0D5F"> 
    <title>Patient Information | ReNew You Health & Wellness</title> 
    <!-- Include Supabase Client Dependency --> 
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script> 
    <!-- External Theme Tokens and Base Layout Stylesheet --> 
    <link rel="stylesheet" href="assets/css/style.css"> 
    <link rel="icon" type="image/png" href="images/fav.png"> 
</head> 
<body> 
    <!-- Dynamic Header Component Slot Target --> 
    <div id="navigation-target"></div> 
    
    <!-- NEW Dynamic Side-by-Side Hero Component Target --> 
    <div id="patients-hero-target"></div> 
    
    <main style="background-color: #F9F9F8;"> 
        <!-- Dynamic JavaScript Target Container Slot for Pre-Visit Checklist --> 
        <section style="padding: 40px 20px; text-align: center; box-sizing: border-box;"> 
            <div id="patient-checklist-target"></div> 
        </section> 

        <!-- Payment Options & Financial Structure Section Wrapper --> 
        <div style="background-color: #ffffff; border-top: 1px solid rgba(138, 52, 159, 0.05);"> 
            <section style="text-align: center; padding: 80px 20px; max-width: 1450px; margin: 0 auto; box-sizing: border-box;"> 
                <h2 style="color: var(--purple-primary); font-size: 2rem; font-weight: 800; margin: 0 0 12px 0; letter-spacing: -0.3px;">Billing & Payments</h2> 
                <p style="color: #555; font-size: 1.05rem; max-width: 600px; margin: 0 auto 40px auto; line-height: 1.6;">
                    We believe in open pricing and affordable primary healthcare alternatives for our community.
                </p> 
                <!-- Dynamic JavaScript Target Container Slot for Payment Framework Cards --> 
                <div id="patient-payment-target" style="max-width: 800px; margin: 0 auto;"></div> 
            </section> 
        </div> 
    </main> 

    <!-- Dynamic Footer Component Slot Target --> 
    <div id="footer-target"></div> 

    <!-- Layout Scripts Execution Flow --> 
    <script src="assets/js/navigation.js"></script> 
    <script src="assets/js/hero.js"></script> 
    <!-- Patients Page Dedicated Hero Controller -->
    <script src="assets/js/patients-hero.js"></script> 
    <!-- Page Functional Event Logic Engine --> 
    <script src="assets/js/patients.js"></script> 
    <script src="assets/js/footer.js"></script> 
</body> 
</html>
